.note{border-radius:12px;padding:10px 14px;margin:10px 0;font-size:13px}.note.rd{background:color-mix(in srgb,#dc2626 12%,var(--card));border:1px solid color-mix(in srgb,#dc2626 40%,transparent)}.note.am{background:color-mix(in srgb,#f59e0b 14%,var(--card));border:1px solid color-mix(in srgb,#f59e0b 45%,transparent)}
.flags{display:flex;gap:14px;flex-wrap:wrap;margin:10px 0}.empty{text-align:center;color:var(--mu);padding:22px 12px}.empty svg{color:var(--gold)}.empty b{display:block;color:var(--tx);margin-top:4px}.empty p{margin:2px 0 0}
.dcnt{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:10px;margin-top:10px}.dcnt div{background:var(--soft);border-radius:12px;padding:10px 12px}.dcnt b{display:block;font:700 20px var(--sf)}.dcnt small{color:var(--mu)}
.dz{display:flex;gap:14px;align-items:center;flex-wrap:wrap;padding:14px 0;border-top:1px solid var(--bd)}.dz>div{flex:1 1 260px}
.md{display:none;position:fixed;inset:0;background:rgba(4,10,26,.62);z-index:40;align-items:center;justify-content:center;padding:14px;backdrop-filter:blur(3px)}.md.on{display:flex}
.mb{background:var(--card);border-radius:20px;padding:20px;width:min(480px,100%);max-height:92vh;overflow:auto;border:1px solid var(--gold);box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}.mb.wide{width:min(900px,100%)}
.mh{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;margin-bottom:10px}.mh h2{font:700 21px var(--sf)}.mh .bdg{display:flex;gap:6px;flex-wrap:wrap}.x{border:0;background:var(--soft);color:var(--tx);width:32px;height:32px;border-radius:10px;cursor:pointer;display:grid;place-items:center;flex:none;margin-left:auto}
.fl{display:block;margin:10px 0;font-size:12px;font-weight:600;color:var(--mu)}.fl input,.fl select,.fl textarea{margin-top:4px}.rq{color:#dc2626}
.ts{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0e1a33;color:#fff;padding:11px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:60;max-width:90vw;border:1px solid var(--gold)}.ts.on{opacity:1}
footer{margin-top:auto;padding-top:22px}footer>div{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;border-top:1px solid var(--bd);padding-top:14px;color:var(--mu);font-size:12px}
@media (max-width:1180px){.tiles,.tiles.s4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}.info{grid-template-columns:repeat(2,1fr)}}
@media (max-width:900px){.g2,.g3,.g2m,.g2f,.g3f,.g4f{grid-template-columns:1fr}.tiles.s3{grid-template-columns:1fr}}
@media (max-height:780px) and (min-width:761px){.brand img{width:56%}.tag{display:none}nav a{padding:7px 12px}.ng{margin-top:8px}}
@media (max-width:760px){.app{display:block}aside{position:static;height:auto;padding:10px 12px}.brand{display:flex;align-items:center;justify-content:center;gap:10px;padding-bottom:10px}.brand img{width:96px}.brand .tag{margin:0}.hotel,.sv,.ng{display:none}nav{display:flex;gap:6px;overflow-x:auto;flex:none}nav a{white-space:nowrap;margin:0;padding:8px 12px}main{padding:12px}.top{flex-wrap:wrap}.u select{max-width:150px}.tiles,.tiles.s3,.tiles.s4{grid-template-columns:1fr 1fr;gap:10px}.tile{padding:12px;flex-direction:column;align-items:flex-start;gap:8px}.tile b{font-size:22px}.hero{padding:18px}.hero h1{font-size:25px}.rg{grid-template-columns:repeat(auto-fill,minmax(82px,1fr))}.fr{flex-direction:column}.fn{width:auto;padding:4px;display:flex;gap:6px}.info{grid-template-columns:1fr 1fr}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

 case 'wo':U.bell=0;woModal(d.id);break;
 case 'woact':{const w=g(d.id),mine=isTech()&&(isChief()||w.asg==me().id);
  if(d.k=='take'){if(role()!='Technician')return deny();w.asg=me().id;if(w.st=='Open')w.st='Assigned';wlog(w,'Mengambil WO')}
  else if(d.k=='start'){if(!mine)return deny();w.st='In Progress';wlog(w,'Pekerjaan dimulai')}
  else if(d.k=='wait'){if(!mine)return deny();w.st='Waiting Part';wlog(w,'Menunggu spare part')}
  else if(d.k=='resume'){if(!mine)return deny();w.st='In Progress';wlog(w,'Pekerjaan dilanjutkan')}
  else if(d.k=='done'){if(!mine)return deny();form('Selesaikan '+w.id,[{k:'n',l:'Ringkasan pekerjaan',t:'a',r:1,ph:'Apa yang diperbaiki / diganti'}],{},o=>{woComplete(w,o.n);save();render();woModal(w.id)},'Tandai selesai');break}
  else if(d.k=='verify'){if(!(isChief()||isSup()))return deny();w.st='Verified';wlog(w,'Diverifikasi')}
  else if(d.k=='cancel'){if(!isChief())return deny();w.st='Cancelled';wlog(w,'WO dibatalkan');const r=w.room&&room(w.room);if(r&&r.ooo&&r.ooo.wo==w.id)toast('WO dibatalkan. Kamar '+r.n+' tetap OOO, kembalikan secara manual bila perlu.')}
  else if(d.k=='reopen'){if(!isChief())return deny();w.st=w.asg?'Assigned':'Open';w.done=null;w.due=Date.now()+slaMs(w.pr);wlog(w,'Dibuka kembali')}
  save();render();woModal(d.id);break}
 case 'wpart':{const w=g(d.id);if(!(isTech()&&(isChief()||w.asg==me().id)))return deny();if(usePart(w,$('wp-i').value,+$('wp-q').value)){save();render();woModal(d.id);toast('Part dicatat dan stok berkurang')}break}
 case 'wnote':{const w=g(d.id),t=($('wn').value||'').trim();if(!t)return;wlog(w,'Catatan: '+t);save();woModal(d.id);break}
 case 'pmdo':{if(!isTech())return deny();const p=S.pm[+d.i],a=asset(p.a);form('Kerjakan PM · '+a.n,[{k:'ok',l:'Hasil pemeriksaan',t:'s',o:[['1','Normal — sesuai standar'],['0','Ada temuan — buat Work Order']]},{k:'note',l:'Catatan',t:'a',ph:p.t}],{},o=>{pmDone(p,o.ok=='1',o.note||'Sesuai checklist');save();render();toast(o.ok=='1'?'PM dicatat. Jadwal berikutnya '+fd(pmNext(p)):'PM dicatat dan WO tindak lanjut dibuat')},'Simpan PM');break}
 case 'pmnew':{if(!isChief())return deny();pmForm(-1);break}
 case 'pmedit':{if(!isChief())return deny();pmForm(+d.i);break}
 case 'pmdel':{if(!isChief())return deny();S.pm.splice(+d.i,1);save();render();toast('Jadwal PM dihapus');break}
 case 'asset':U.bell=0;assetModal(d.id);break;
 case 'assetnew':{if(!isChief())return deny();assetForm();break}
 case 'assetedit':{if(!isChief())return deny();assetForm(d.id);break}
 case 'assetdel':{if(!isChief())return deny();confirmM('Hapus aset?','Aset beserta jadwal PM-nya akan dihapus. Work order lama tetap tersimpan.','Ya, hapus','data-a="assetdel2" data-id="'+d.id+'"',true);break}
 case 'assetdel2':{S.pm=S.pm.filter(p=>p.a!=d.id);S.assets=S.assets.filter(x=>x.id!=d.id);save();closeM();render();toast('Aset dihapus');break}
 case 'invnew':{const hkd=d.d=='HK';if(!(hkd?isSup():isChief()))return deny();form('Item inventori baru',[{k:'n',l:'Nama item',r:1},{k:'c',l:'Kategori',t:'s',o:hkd?['Linen','Amenities','Chemicals']:['Spare Part','Consumable']},{k:'u',l:'Satuan',v:'pcs'},{k:'stock',l:'Stok awal',t:'n',v:0},{k:'min',l:'Stok minimum',t:'n',v:0},{k:'cost',l:'Harga satuan (Rp)',t:'n',v:0}],{},o=>{S.seq.inv=(S.seq.inv||S.inv.length)+1;S.inv.push({id:'I'+pad(S.seq.inv+100,3),d:d.d,c:o.c,n:o.n,u:o.u||'pcs',stock:+o.stock||0,min:+o.min||0,cost:+o.cost||0});save();render();toast('Item ditambahkan')});break}
 case 'invin':case 'invout':{const it=S.inv[+d.i];if(!(it.d=='HK'?isSup():isChief()))return deny();const inn=a=='invin';form((inn?'Barang masuk · ':'Barang keluar · ')+it.n,[{k:'q',l:'Jumlah ('+it.u+')',t:'n',r:1},{k:'ref',l:'Referensi / keterangan',ph:inn?'No. PO / penerimaan':'Kamar / keperluan'}],{},o=>{if(!move(it,inn?'in':'out',o.q,o.ref))return false;save();render();toast(it.n+': stok '+it.stock+' '+it.u)});break}
 case 'invedit':{const it=S.inv[+d.i];if(!(it.d=='HK'?isSup():isChief()))return deny();form('Ubah item',[{k:'n',l:'Nama item',r:1},{k:'min',l:'Stok minimum',t:'n'},{k:'cost',l:'Harga satuan (Rp)',t:'n'},{k:'u',l:'Satuan'}],it,o=>{Object.assign(it,{n:o.n,min:+o.min||0,cost:+o.cost||0,u:o.u||it.u});save();render();toast('Item diperbarui')});break}
 case 'utilnew':case 'utiledit':{if(!(isTech()||isGM()))return deny();const ed=a=='utiledit',u=ed?S.util[+d.i]:{d:ymd(Date.now()),oc:kp().occ,kwh:'',wt:'',lpg:''};form(ed?'Ubah catatan meter':'Catat meter harian',[{k:'d',l:'Tanggal',t:'d',r:1},{k:'oc',l:'Kamar terisi',t:'n',r:1},{k:'kwh',l:'Listrik (kWh)',t:'n',r:1},{k:'wt',l:'Air (m³)',t:'n'},{k:'lpg',l:'LPG (kg)',t:'n'}],u,o=>{const x={d:o.d,oc:+o.oc,kwh:+o.kwh,wt:+o.wt||0,lpg:+o.lpg||0},dupe=S.util.findIndex(y=>y.d==o.d);if(ed)S.util[+d.i]=x;else if(dupe>-1)S.util[dupe]=x;else S.util.push(x);S.util.sort((p,q)=>p.d<q.d?-1:1);save();render();toast('Catatan meter disimpan')});break}
 case 'utildel':{if(!(isTech()||isGM()))return deny();S.util.splice(+d.i,1);save();render();break}
 case 'csvwo':csvOut('work-order.csv',[['No. WO','Judul','Lokasi','Kategori','Prioritas','Status','PIC','Dibuat','Batas SLA','Selesai']].concat(S.wo.map(w=>[w.id,w.t,w.loc,w.cat,w.pr,w.st,stn(w.asg),new Date(w.at).toISOString(),new Date(w.due).toISOString(),w.done?new Date(w.done).toISOString():''])));break;
 case 'csvhk':csvOut('housekeeping-log.csv',[['Waktu','Kamar','Dari','Ke','Attendant','Menit']].concat(S.hklog.map(h=>[new Date(h.t).toISOString(),h.room,h.from,h.to,stn(h.by),h.min])));break;
 case 'setsave':{if(!canSet())return deny();const v=id=>+$(id).value;S.set.hotel={n:($('sh-n').value||'').trim()||S.set.hotel.n,c:($('sh-c').value||'').trim()||S.set.hotel.c};Object.keys(S.set.std).forEach(k=>{if(v('ss-'+k)>0)S.set.std[k]=v('ss-'+k)});if(v('s-cap')>0)S.set.cap=v('s-cap');if(v('s-pass')>0&&v('s-pass')<=100)S.set.pass=v('s-pass');if(v('s-kwh')>0)S.set.kwh=v('s-kwh');save();render();toast('Pengaturan disimpan');break}
 case 'slasave':{if(!canSet())return deny();Object.keys(PRC).forEach(k=>{const x=+$('sl-'+k).value;if(x>0)S.set.sla[k]=x});save();render();toast('SLA disimpan');break}
 case 'teamnew':{if(!isGM())return deny();teamForm(-1);break}
 case 'teamedit':{if(!isGM())return deny();teamForm(+d.i);break}
 case 'teamdel':{if(!isGM())return deny();const s=S.staff[+d.i];if(s.id==S.me){toast('Anda tidak dapat menghapus akun yang sedang dipakai');break}S.rooms.forEach(r=>{if(r.att==s.id)r.att=''});S.staff.splice(+d.i,1);save();render();toast('Anggota tim dihapus');break}
 case 'reset':{if(!isGM())return deny();confirmM('Kembalikan ke data contoh?','Seluruh data saat ini akan diganti dengan data contoh. Tindakan ini tidak dapat dibatalkan.','Ya, reset','data-a="resetok"');break}
 case 'resetok':doReset();break;
 case 'wipe':{if(!isGM())return deny();openM('<div class="mh"><h2 style="color:var(--bad)">Kosongkan data?</h2><button class="x" data-a="mclose" aria-label="Tutup">'+ic('x',18)+'</button></div><p class="s" style="margin:6px 0">Work order, jadwal riwayat PM, inspeksi, log pembersihan, permintaan tamu, lost &amp; found, pergerakan stok, dan catatan meter akan dihapus permanen. Status semua kamar kembali ke VD.</p><label class="fl ck"><input type="checkbox" id="wm"> Hapus juga master data (kamar, aset, jadwal PM, item inventori)</label><label class="fl">Ketik <b>HAPUS</b> untuk melanjutkan<input type="text" id="wc" autocomplete="off" placeholder="HAPUS"></label><div class="bt"><button class="btn dg" id="wbtn" data-a="wipeok" disabled>Kosongkan data</button><button class="btn o" data-a="mclose">Batal</button></div>');break}
 case 'wipeok':doWipe();break;
 }}
/* ---------------- events ---------------- */
document.addEventListener('click',e=>{const t=e.target;if(U.bell&&!t.closest('.bellw')){U.bell=0;renderTop()}if(t.id=='md'){closeM();return}const a=t.closest('[data-a]');if(!a)return;act(a.dataset.a,a.dataset,a)});
document.addEventListener('keydown',e=>{if(e.key=='Escape'){if($('md').classList.contains('on'))closeM();if(U.bell){U.bell=0;renderTop()}return}if((e.key=='Enter'||e.key==' ')&&e.target.matches&&e.target.matches('[data-a][tabindex]')){e.preventDefault();e.target.click()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id=='me'){S.me=t.value;save();U.bell=0;render();toast('Masuk sebagai '+me().n+' ('+me().r+')');return}
 if(t.dataset.rp){U.rp=+t.value;render();return}
 if(t.dataset.ft&&t.type!='text'){U.f[t.dataset.ft][t.dataset.fk]=t.type=='checkbox'?(t.checked?1:0):t.value;render();return}
 const ch=t.dataset.ch;if(!ch)return;
 if(ch=='ratt'){if(!isSup()){deny();return}const r=room(t.dataset.n);r.att=t.value;rlog(r,'Ditugaskan ke '+stn(t.value));save();render();roomModal(r.n)}
 else if(ch=='rflag'){if(!canHK()){deny();return}const r=room(t.dataset.n);r[t.dataset.k]=t.checked?1:0;rlog(r,t.dataset.k.toUpperCase()+(t.checked?' aktif':' nonaktif'));save();render();roomModal(r.n)}
 else if(ch=='rnote'){const r=room(t.dataset.n);r.note=t.value;save();toast('Catatan tersimpan')}
 else if(ch=='woasg'){if(!isChief()){deny();return}const w=S.wo.find(x=>x.id==t.dataset.id);w.asg=t.value;if(t.value&&w.st=='Open')w.st='Assigned';wlog(w,t.value?'Ditugaskan ke '+stn(t.value):'Penugasan dihapus');save();render();woModal(w.id)}});
document.addEventListener('input',e=>{const t=e.target;if(t.id=='gs'){U.gq=t.value.trim();render();return}if(t.dataset.ft&&t.type=='text'){U.f[t.dataset.ft][t.dataset.fk]=t.value;render();return}if(t.id=='wc'){const b=$('wbtn');if(b)b.disabled=t.value.trim().toUpperCase()!='HAPUS'}});
window.addEventListener('popstate',()=>{U.pg=routeKey()||'dash';U.gq='';U.bell=0;closeM();render();scrollTo(0,0)});
const k0=routeKey();if(k0)U.pg=k0;render();setURL(U.pg,false);
})();

</script></body></html>
