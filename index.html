<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>CoreStay Ops</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0A0F28;--bg2:#131A45;--card:#161E4B;--tx:#F7F2E6;--mut:#BDC3E0;--line:#2F3A72;--gold:#EBC96B;--err:#FF9DB0;color-scheme:dark}
:root[data-t=light]{--bg:#F8F4E9;--bg2:#EFE7D0;--card:#FFFFFF;--tx:#181A3C;--mut:#4B5079;--line:#DCD2B3;--gold:#7E5B0A;--err:#B01553;color-scheme:light}
*{box-sizing:border-box}
body{margin:0;font:15px/1.55 'DM Sans',system-ui,sans-serif;color:var(--tx);background:radial-gradient(900px 520px at 90% -10%,rgba(139,92,255,.30),transparent),radial-gradient(760px 520px at -10% 105%,rgba(20,200,180,.22),transparent),var(--bg);min-height:100vh}
h1,h2,h3{font-family:'Cormorant Garamond',Georgia,serif;margin:0;font-weight:700}
h1{font-size:38px;line-height:1.1}h2{font-size:24px;margin-bottom:12px}
.mut{color:var(--mut)}.sub{font-size:13px}
.skip{position:absolute;left:-999px}.skip:focus{left:12px;top:12px;z-index:9;background:#fff;color:#000;padding:10px 14px;border-radius:10px}
:focus-visible{outline:3px solid #7CC4FF;outline-offset:2px}
.app{display:flex;min-height:100vh}
aside{width:262px;flex:none;position:sticky;top:0;height:100vh;overflow:auto;padding:22px 14px;background:linear-gradient(180deg,#080B20,#1A1052);border-right:1px solid rgba(235,201,107,.35);color:#F7F2E6}
.brand{display:flex;align-items:center;gap:10px;margin-bottom:18px;padding:0 6px}.brand img{width:64px;height:auto}.brand b{font:700 26px 'Cormorant Garamond',Georgia,serif;color:#EBC96B}
.sec{margin:18px 10px 6px;font-size:13px;color:#EBC96B;font-weight:700}
nav a{display:flex;align-items:center;gap:12px;min-height:44px;padding:0 14px;border-radius:14px;color:#DDE0F5;text-decoration:none;font-weight:500}
nav a i{width:10px;height:10px;border-radius:50%;flex:none}
nav a:hover{background:rgba(255,255,255,.08)}
nav a[aria-current]{background:linear-gradient(135deg,#F4DC8F,#C99A2E);color:#1B1403;font-weight:700}
main{flex:1;min-width:0;padding:30px;display:flex;flex-direction:column;gap:22px}
.hd,.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.hd{justify-content:space-between}.end{justify-content:flex-end;margin-top:14px}
.btn{min-height:44px;padding:0 20px;border-radius:99px;border:1px solid var(--line);background:transparent;color:var(--tx);font:700 14px 'DM Sans',sans-serif;cursor:pointer}

.btn.dg{color:var(--err);border-color:var(--err)}
select,input:not([type=checkbox]),textarea{width:100%;min-height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--tx);padding:0 12px;font:inherit}
textarea{padding:10px 12px}.row select{width:auto}
label{display:block;margin-top:12px;font-weight:700;font-size:13px}label select,label input,label textarea{margin-top:5px;font-weight:400}
label.chk{display:flex;gap:10px;align-items:center;min-height:44px}label.chk input{width:20px;height:20px}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}
.k{border-radius:26px 26px 26px 6px;padding:18px 20px;color:#0A0F28;background:linear-gradient(135deg,var(--a),var(--b));box-shadow:0 12px 28px rgba(0,0,0,.28)}
.k span{font-weight:700}.k b{display:block;font:700 44px/1.1 'Cormorant Garamond',Georgia,serif}.k small{font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 12px 30px rgba(0,0,0,.22)}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:18px}
.b{display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:99px;font-size:12px;font-weight:700;background:var(--c);color:#0A0F28;white-space:nowrap}
.bar{display:grid;grid-template-columns:150px 1fr 36px;gap:12px;align-items:center;margin:9px 0}.bar i{display:block;height:14px;border-radius:99px;background:var(--c)}.bar div{background:var(--bg2);border-radius:99px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:12px}
.tile{all:unset;box-sizing:border-box;cursor:pointer;min-height:98px;padding:12px;border-radius:16px;background:var(--c);color:#0A0F28;display:flex;flex-direction:column;gap:2px;border-top:4px solid rgba(255,255,255,.55);box-shadow:0 8px 18px rgba(0,0,0,.25)}
.tile:hover{transform:translateY(-2px)}.tile:focus-visible{outline:3px solid #7CC4FF;outline-offset:2px}
.tile b{font:700 26px/1 'Cormorant Garamond',Georgia,serif}.tile small{font-size:12px;font-weight:500}.tile em{font-style:normal;font-weight:700;font-size:12px}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:820px}
th{text-align:left;color:var(--gold);font-size:13px;padding:10px 8px;border-bottom:2px solid var(--line)}td{padding:11px 8px;border-bottom:1px solid var(--line);vertical-align:top}
.late{color:var(--err);font-weight:700}.err{color:var(--err);min-height:20px;margin:8px 0 0}
dialog{width:min(580px,94vw);max-height:92vh;overflow:auto;background:var(--card);color:var(--tx);border:1px solid var(--gold);border-radius:24px;padding:26px}
dialog::backdrop{background:rgba(4,6,20,.72)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:linear-gradient(135deg,#F4DC8F,#C99A2E);color:#1B1403;font-weight:700;padding:12px 22px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}#toast.show{opacity:1}
.ft{margin-top:auto;padding-top:18px;border-top:1px solid var(--line);display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between;font-size:13px;color:var(--mut)}.ft a{color:inherit;font-weight:700}
.li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
@media(max-width:900px){.app{display:block}aside{position:static;width:auto;height:auto;padding:12px}nav{display:flex;gap:6px;overflow-x:auto}.sec{display:none}nav a{flex:none}main{padding:16px}h1{font-size:30px}.bar{grid-template-columns:110px 1fr 30px}}
@media print{aside,.noprint,#toast{display:none!important}body{background:#fff}:root,:root[data-t=light]{--card:#fff;--tx:#000;--mut:#333;--line:#999;--bg2:#eee;--gold:#000}.card,.k{box-shadow:none;border:1px solid #999}main{padding:0}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}

<script>
const HOT=['Bandung','Jakarta','Bali','Surabaya'],VER='1.1.0',BUILD='2026-11-09',KEY='corestay-ops-v1',TK='corestay-ops-theme';
const ST={VD:['Vacant Dirty','Kosong kotor','#FF5C7A'],CL:['Cleaning','Sedang dibersihkan','#FFB020'],VC:['Vacant Clean','Kosong bersih','#35D0E0'],VI:['Inspected','Siap dijual','#34E3A0'],OD:['Occupied Dirty','Terisi kotor','#FF8F5A'],OC:['Occupied Clean','Terisi bersih','#8B9BFF'],OOO:['Out of Order','Diblokir teknik','#C77DFF']};
const PRI={E:['Emergency',15,240,'#FF5C7A'],U:['Urgent',30,480,'#FF8F5A'],H:['High',120,1440,'#FFB020'],N:['Normal',480,4320,'#35D0E0'],L:['Low',1440,10080,'#8B9BFF']};
const WS={open:'Baru',asg:'Ditugaskan',prog:'Dikerjakan',parts:'Menunggu suku cadang',done:'Menunggu verifikasi',closed:'Ditutup',cancel:'Dibatalkan'},ACTV=['open','asg','prog','parts'];
const CAT=['AC dan HVAC','Listrik','Plumbing','Furnitur dan kayu','Lift','Pemadam dan K3','Kolam dan mekanikal','IT dan TV'];
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const now=()=>Date.now(),iso=t=>new Date(t).toISOString(),ago=m=>iso(now()-m*6e4),ds=d=>d.toISOString().slice(0,10),today=()=>ds(new Date()),add=(s,n)=>ds(new Date(new Date(s).getTime()+n*864e5));
const fmt=t=>new Date(t).toLocaleString('id-ID',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit',hour12:false});
const dur=m=>m<60?Math.round(m)+' mnt':m<1440?(m/60).toFixed(1).replace('.',',')+' jam':Math.round(m/1440)+' hari';
const hc=h=>h.slice(0,3).toUpperCase();
function seed(){
 const N1=['Sari','Budi','Dewi','Agus','Rina','Joko','Wulan','Hadi','Putri','Eko','Maya','Rudi'],N2=['Wijaya','Santoso','Lestari','Pratama','Hidayat','Kusuma'];let k=0;const nm=()=>N1[k%12]+' '+N2[(k++*5)%6];
 const staff=[],rooms=[];
 HOT.forEach((h,hi)=>{for(let i=0;i<3;i++)staff.push({id:'h'+hi+i,name:nm(),hotel:h,role:'hk'});for(let i=0;i<2;i++)staff.push({id:'e'+hi+i,name:nm(),hotel:h,role:'eng'});
  for(let f=1;f<=4;f++)for(let r=1;r<=5;r++){const n=f*100+r,x=((f-1)*5+r*3+hi*2)%10,st=['VI','OC','VD','OD','VC','OC','VI','CL','OC','VD'][x],dirty=['VD','OD','CL'].includes(st);
   rooms.push({id:hc(h)+'-'+n,hotel:h,no:n,floor:f,type:f<3?'Superior':f===3?'Deluxe':'Suite',st,occ:{VD:x%2?'vac':'arr',OD:'stay',OC:'stay',CL:'vac',VI:'arr',VC:'vac'}[st],dnd:n%17===0&&st==='OC',att:dirty?'h'+hi+(n%3):'',note:''})}});
 const W=[[0,'204','AC dan HVAC','U','AC kamar tidak dingin','prog',700,'e00',1],[1,'','Plumbing','E','Kebocoran pipa area lobi','asg',20,'e10',0],[2,'302','Listrik','H','Stopkontak kamar tidak berfungsi','open',200,'',0],[3,'','Lift','N','Lift barang berbunyi kasar','parts',3000,'e30',0],[0,'','Pemadam dan K3','N','Ganti APAR kedaluwarsa lantai 2','done',500,'e01',0,470],[1,'403','Furnitur dan kayu','L','Engsel lemari longgar','open',90,'',0],[2,'','Kolam dan mekanikal','H','Pompa kolam bising','prog',600,'e21',0],[0,'102','Listrik','N','Ganti lampu kamar mandi','closed',4000,'e01',0,300],[1,'','AC dan HVAC','H','AC lobi tidak dingin','closed',6000,'e11',0,1700],[2,'','Plumbing','U','Keran dapur bocor','closed',8000,'e20',0,200],[3,'305','Furnitur dan kayu','L','Pintu lemari macet','closed',9000,'e31',0,600],[0,'','Lift','E','Lift penumpang terhenti','closed',12000,'e00',0,180],[2,'201','IT dan TV','N','TV tidak menyala','closed',5000,'e21',0,150]];
 const wo=W.map((a,i)=>({id:'w'+i,no:'WO-'+String(i+1).padStart(4,'0'),hotel:HOT[a[0]],room:a[1]?hc(HOT[a[0]])+'-'+a[1]:'',loc:a[1]?'Kamar '+a[1]:'Area umum',cat:a[2],pri:a[3],title:a[4],desc:'',st:a[5],created:ago(a[6]),tech:a[7],block:!!a[8],notes:'',done:a[9]?ago(a[6]-a[9]):''}));
 wo.filter(w=>w.block).forEach(w=>{const r=rooms.find(x=>x.id===w.room);r.st='OOO';r.occ='vac';r.att=''});
 const P=[['Servis chiller AC',0,90,100],['Tes genset berbeban',1,7,3],['Cek APAR dan hydrant',2,30,31],['Bersihkan grease trap dapur',3,14,10],['Inspeksi lift penumpang',1,30,12],['Uji alarm kebakaran',0,30,29],['Kuras dan klorin tandon air',2,90,40],['Servis pompa kolam',3,30,35]];
 const IT=[['hk','Linen','Sprei king','lembar',160,60],['hk','Linen','Sarung bantal','lembar',260,100],['hk','Linen','Handuk mandi','lembar',240,90],['hk','Linen','Handuk tangan','lembar',200,80],['hk','Linen','Bath mat','lembar',120,50],['hk','Linen','Bathrobe','lembar',80,30],['hk','Chemical','Glass cleaner','liter',40,15],['hk','Chemical','Disinfektan kamar mandi','liter',50,20],['hk','Chemical','Detergen laundry','kg',80,30],['hk','Chemical','Pewangi ruangan','liter',30,10],['eng','Tools','Bor listrik','unit',4,2],['eng','Tools','Multimeter','unit',5,3],['eng','Suku cadang','Bohlam LED','pcs',100,40],['eng','Suku cadang','Filter AC','pcs',40,15],['eng','Suku cadang','Oli pompa','liter',20,8],['eng','Suku cadang','MCB 16A','pcs',20,8]],RT=[1.05,.7,1.1,.3,.95,1.2,.2],items=[],mv=[];
 HOT.forEach((h,hi)=>IT.forEach((t,i)=>{const it={id:'i'+hi+'-'+i,hotel:h,dept:t[0],cat:t[1],name:t[2],unit:t[3],par:t[4],min:t[5],stock:Math.round(t[4]*RT[(i+hi*2)%7])};items.push(it);
  [[20,'in',.3],[3,'out',.06],[9,'out',.08],[15,'out',.07],[6,'bad',.02]].forEach((e,j)=>mv.push({id:'m'+items.length+'-'+j,t:ago(e[0]*1440+(i*37+hi*11)%600),item:it.id,type:e[1],qty:Math.max(1,Math.round(t[4]*e[2]*(1+(i+hi)%3/2))),note:'',wo:''}))}));
 const log=[];for(let i=0;i<72;i++){const hi=i%4,rr=rooms.filter(x=>x.hotel===HOT[hi]),r=rr[(i*7)%rr.length],k=i%10,m=k<5?': selesai dibersihkan':k<7?': tamu check-out, perlu dibersihkan':k<8?': tamu check-in':k<9?' lulus, siap dijual':' gagal, dibersihkan ulang';log.push({t:ago((i*137)%(14*1440)),m:(k>=8?'Inspeksi kamar ':'Kamar ')+r.no+' '+HOT[hi]+m,r:r.id})}
 log.sort((a,b)=>b.t.localeCompare(a.t));
 return{v:2,rooms,staff,wo,items,mv,pm:P.map((p,i)=>({id:'p'+i,name:p[0],hotel:HOT[p[1]],freq:p[2],last:add(today(),-p[3]),hist:[add(today(),-p[3])]})),log,seq:W.length+1}}
let S=(()=>{try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.v===2)return d}catch(e){}return seed()})();
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}},R=id=>S.rooms.find(x=>x.id===id),T=id=>S.staff.find(x=>x.id===id);
const logA=(m,r)=>{S.log.unshift({t:iso(now()),m,r:r||''});S.log.length=Math.min(S.log.length,300)};
let UI={f:'Semua',v:'dash',rs:'Semua',ws:'aktif',rp:30},OK=null,tt;
const fh=a=>a.filter(x=>UI.f==='Semua'||x.hotel===UI.f),badge=(l,c)=>`<span class="b" style="--c:${c}">${l}</span>`;
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='show';clearTimeout(tt);tt=setTimeout(()=>t.className='',2600)};
function sla(w){if(!ACTV.includes(w.st))return{t:'',late:false};const p=PRI[w.pri],age=(now()-new Date(w.created))/6e4,left=p[2]-age,rl=w.st==='open'&&age>p[1];return{late:left<0||rl,t:left<0?'Lewat '+dur(-left):rl?'Respon terlambat':'Sisa '+dur(left)}}
const pmDue=p=>add(p.last,p.freq),pmSt=p=>{const d=pmDue(p);return d<today()?['Terlambat','#FF5C7A']:d<=add(today(),7)?['Segera','#FFB020']:['Terjadwal','#34E3A0']};
const kpi=(a,b,l,v,s)=>`<div class="k" style="--a:${a};--b:${b}"><span>${l}</span><b>${v}</b><small>${s}</small></div>`;
const V={
dash(){const rs=fh(S.rooms),c=k=>rs.filter(r=>r.st===k).length,wo=fh(S.wo),act=wo.filter(w=>ACTV.includes(w.st)),pm=fh(S.pm).filter(p=>pmSt(p)[0]==='Terlambat');
 const bars=Object.entries(ST).map(([k,v])=>`<div class="bar"><span>${k} ${v[1]}</span><div><i style="--c:${v[2]};width:${rs.length?c(k)/rs.length*100:0}%"></i></div><b>${c(k)}</b></div>`).join('');
 const pb=Object.entries(PRI).map(([k,v])=>`<div class="bar"><span>${v[0]}</span><div><i style="--c:${v[3]};width:${act.length?act.filter(w=>w.pri===k).length/act.length*100:0}%"></i></div><b>${act.filter(w=>w.pri===k).length}</b></div>`).join('');
 const rows=HOT.filter(h=>UI.f==='Semua'||h===UI.f).map(h=>{const r=S.rooms.filter(x=>x.hotel===h);return`<tr><td><b>${h}</b></td><td>${Math.round(r.filter(x=>x.st==='VI').length/r.length*100)}%</td><td>${r.filter(x=>x.st==='VD'||x.st==='OD').length}</td><td>${r.filter(x=>x.st==='OOO').length}</td><td>${S.wo.filter(w=>w.hotel===h&&ACTV.includes(w.st)).length}</td></tr>`}).join('');
 return`<div class="g">${kpi('#34E3A0','#35D0E0','Kamar siap dijual',c('VI'),'Sudah diinspeksi')}${kpi('#FF5C7A','#FF8F5A','Perlu dibersihkan',c('VD')+c('OD'),'Kosong dan terisi kotor')}${kpi('#FFB020','#FFE08A','Sedang dibersihkan',c('CL'),'Dikerjakan petugas')}${kpi('#C77DFF','#8B9BFF','Kamar diblokir',c('OOO'),'Out of Order')}</div>
 <div class="g">${kpi('#FF8F5A','#FFB020','Work order aktif',act.length,'Baru sampai menunggu suku cadang')}${kpi('#FF5C7A','#C77DFF','Melewati SLA',act.filter(w=>sla(w).late).length,'Perlu ditindak')}${kpi('#35D0E0','#8B9BFF','PM terlambat',pm.length,'Preventive maintenance')}${kpi('#EBC96B','#FFE9A8','Menunggu verifikasi',wo.filter(w=>w.st==='done').length,'Pekerjaan selesai')}</div>
 <div class="two"><section class="card"><h2>Status kamar</h2>${bars}</section><section class="card"><h2>Work order aktif per prioritas</h2>${pb}</section></div>
 <div class="two"><section class="card"><h2>Kesiapan per hotel</h2><div class="tw"><table style="min-width:420px"><thead><tr><th>Hotel</th><th>Siap jual</th><th>Perlu bersih</th><th>Diblokir</th><th>WO aktif</th></tr></thead><tbody>${rows}</tbody></table></div></section>
 <section class="card"><h2>Aktivitas terbaru</h2>${S.log.slice(0,7).map(l=>`<div class="li"><span>${esc(l.m)}</span><span class="mut sub">${fmt(l.t)}</span></div>`).join('')||'<p class="mut">Belum ada aktivitas. Ubah status kamar atau buat work order untuk memulai.</p>'}</section></div>`},
rooms(){const chips=['Semua',...Object.keys(ST)].map(k=>`<button class="btn sm${UI.rs===k?' on':''}" data-a="fs:${k}" aria-pressed="${UI.rs===k}">${k==='Semua'?'Semua':k+' '+ST[k][1]}</button>`).join('');
 const sec=HOT.filter(h=>UI.f==='Semua'||h===UI.f).map(h=>`<section class="card"><h2>${h}</h2><div class="board">${S.rooms.filter(r=>r.hotel===h&&(UI.rs==='Semua'||r.st===UI.rs)).map(r=>`<button class="tile" style="--c:${ST[r.st][2]}" data-a="room:${r.id}" aria-label="Kamar ${r.no} ${h}, ${ST[r.st][1]}"><b>${r.no}</b><em>${r.st}${r.dnd?' DND':''}</em><small>${r.type}</small><small>${r.att&&T(r.att)?T(r.att).name.split(' ')[0]:'&nbsp;'}</small></button>`).join('')||'<p class="mut">Tidak ada kamar dengan status ini.</p>'}</div></section>`).join('');
 return`<div class="row" role="group" aria-label="Filter status">${chips}</div>${sec}`},
wo(){const L=fh(S.wo).filter(w=>UI.ws==='semua'||(UI.ws==='aktif'?ACTV.concat('done').includes(w.st):!ACTV.includes(w.st))).sort((a,b)=>b.created.localeCompare(a.created));
